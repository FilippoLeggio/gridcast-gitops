# Values for the Argo CD Helm chart, installed by hand (later by Terraform) on each cluster.
configs:
  cm:
    # Child Applications report their own health, so that sync waves in an app-of-apps
    # wait for each wave to be healthy before starting the next one.
    resource.customizations.health.argoproj.io_Application: |
      hs = {}
      hs.status = "Progressing"
      hs.message = ""
      if obj.status ~= nil then
        if obj.status.health ~= nil then
          hs.status = obj.status.health.status
          if obj.status.health.message ~= nil then
            hs.message = obj.status.health.message
          end
        end
      end
      return hs