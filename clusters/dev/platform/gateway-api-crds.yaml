apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gateway-api-crds
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  project: default
  source:
    repoURL: https://github.com/kubernetes-sigs/gateway-api
    targetRevision: v1.6.1
    path: config/crd/standard
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      # Never delete CRDs automatically: it would delete every resource of that type.
      prune: false
      selfHeal: true
    syncOptions:
      # CRDs are too large for client-side apply annotations.
      - ServerSideApply=true